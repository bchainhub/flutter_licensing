name: Feature Request
description: Propose an API or licensing workflow improvement
title: "[Feature]: "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
    validations:
      required: true
  - type: dropdown
    id: security
    attributes:
      label: Security model impact
      options:
        - No trust-model change
        - Changes certificate or trust configuration
        - Unsure
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
